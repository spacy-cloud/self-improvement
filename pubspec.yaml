name: self_improvement
description: "Lokale Selbstverbesserungs-App (LF10a, Team IA24)"
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Inter (SIL OFL 1.1) is bundled locally, see assets/fonts/README.md.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    # Licence text, registered in the LicenseRegistry by registerDesignLicenses().
    - assets/fonts/OFL.txt
    # The licence of the own code (the file LICENSE of the repository). The page
    # "Über die App" shows exactly this file; there is no second copy (D-021).
    - LICENSE
